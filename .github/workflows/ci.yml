name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  macos_arm64:
    name: macOS arm64 Rust and Python
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assert native arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build macOS arm64 wheel
        working-directory: crates/can-motor-control-py
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy
          maturin build --release --strip --locked --compatibility pypi
      - name: Validate and install macOS wheel
        run: |
          wheel=$(find target/wheels -name 'can_motor_control-*.whl' -print -quit)
          case "$wheel" in *macosx*arm64.whl) ;; *) echo "unexpected wheel tag: $wheel"; exit 1;; esac
          python -m venv /tmp/can-motor-control-macos
          /tmp/can-motor-control-macos/bin/pip install numpy "$wheel"
          /tmp/can-motor-control-macos/bin/python -c "import can_motor_control as c; assert hasattr(c, 'GsUsbBus'); assert not hasattr(c, 'SocketCanBus')"
      - uses: actions/upload-artifact@v7
        with:
          name: can_motor_control-wheel-macos-arm64
          path: target/wheels/can_motor_control-*.whl
          if-no-files-found: error

  linux_arm64:
    name: Linux arm64 Rust and Python
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Assert native arm64 runner
        run: test "$(uname -m)" = aarch64
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux arm64 wheel
        working-directory: crates/can-motor-control-py
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy pytest
          maturin build --release --strip --compatibility pypi
      - name: Validate and install Linux arm64 wheel
        run: |
          wheel=$(find target/wheels -name 'can_motor_control-*.whl' -print -quit)
          case "$wheel" in *aarch64.whl) ;; *) echo "unexpected wheel tag: $wheel"; exit 1;; esac
          python -m venv /tmp/can-motor-control-linux-arm64
          /tmp/can-motor-control-linux-arm64/bin/pip install numpy pytest "$wheel"
          /tmp/can-motor-control-linux-arm64/bin/python -m pytest tests/python -v
          /tmp/can-motor-control-linux-arm64/bin/python -c "import can_motor_control as c; assert hasattr(c, 'SocketCanBus'); assert not hasattr(c, 'GsUsbBus')"
      - uses: actions/upload-artifact@v7
        with:
          name: can_motor_control-wheel-linux-arm64
          path: target/wheels/can_motor_control-*.whl
          if-no-files-found: error

  no_std:
    name: can-motor-codec / can-motor-damiao-codec no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p can-motor-codec --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p can-motor-damiao-codec --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p can-motor-robstride-codec --no-default-features --target thumbv7em-none-eabihf

  vendor_isolation:
    name: can-motor-control has no vendor dep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Confirm no vendor codec in can-motor-control runtime tree
        run: |
          if cargo tree -p can-motor-control --edges normal | grep -E '\bcan-motor-damiao-codec\b|\bcan-motor-robstride-codec\b|\brobostride\b|\bmyactuator\b'; then
            echo "::error::vendor codec leaked into can-motor-control runtime dependencies"
            exit 1
          fi

  wheel:
    name: maturin build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy
      - name: Build wheel
        working-directory: crates/can-motor-control-py
        run: |
          rm -rf ../../target/wheels
          maturin build --release --strip --locked --compatibility pypi
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: can_motor_control-wheel-linux
          path: target/wheels/can_motor_control-*.whl
          if-no-files-found: error
      - name: Install wheel into a clean venv with only numpy
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/pip install numpy
          /tmp/venv/bin/pip install target/wheels/can_motor_control-*.whl
          /tmp/venv/bin/python -c "import can_motor_control as c; assert hasattr(c, 'SocketCanBus'); assert not hasattr(c, 'GsUsbBus')"

  pytest:
    name: Python smoke tests from wheel
    runs-on: ubuntu-latest
    needs: wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Download built wheel
        uses: actions/download-artifact@v5
        with:
          name: can_motor_control-wheel-linux
          path: wheelhouse
      - name: Install wheel test environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/pip install numpy pytest
          /tmp/venv/bin/pip install wheelhouse/*.whl
      - name: Run pytest
        run: /tmp/venv/bin/python -m pytest tests/python -v

  docs:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Build docs
        run: bash scripts/build-docs.sh --frozen
