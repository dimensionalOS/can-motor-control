site_name: can-motor-control
site_description: Rust-backed control library for Damiao-family CAN motors
site_url: https://tomcc7.github.io/can-motor-control/
repo_url: https://github.com/TomCC7/can-motor-control
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # The package lives here; after `maturin develop` it is also
          # importable from the active environment, which is what lets griffe
          # read the docstrings PyO3 bakes into the compiled `_native` module.
          paths: [crates/can-motor-control-py/python]
          options:
            # Import the built extension so the runtime __doc__ (authored as
            # Rust `///` comments) is the source of the rendered prose — the
            # same text `help()` shows. Without this, griffe would only see the
            # signature-only `.pyi` stubs and render no descriptions.
            force_inspection: true
            # The public package re-exports its classes from the compiled
            # `can_motor_control._native` module (`from can_motor_control._native import ...`).
            # Preload it so griffe inspect-loads the compiled module and those
            # re-export aliases (e.g. can_motor_control.Robot -> _native.Robot) resolve.
            preload_modules:
              - can_motor_control._native
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guides:
      - CAN transports: transports.md
      - Native macOS gs_usb: gs-usb-macos.md
      - SocketCAN setup: socketcan-setup.md
      - Gripper opening: gripper-opening.md
      - CAN-FD: can-fd.md
      - Multi-vendor: multi-vendor.md
      - Release: release.md
  - Python API: reference.md
  - Rust API: rust.md
