[package]
name = "can-motor-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform robot control library for CAN motors with target-native hardware transports"

[features]
default = ["mock"]
mock = []

[dependencies]
motor-codec = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
toml = { workspace = true }
mio = { workspace = true }
libc = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
nusb = { workspace = true }

[dev-dependencies]
robstride-codec = { workspace = true, features = ["std"] }
damiao-codec = { workspace = true, features = ["std"] }
nusb = { workspace = true }
